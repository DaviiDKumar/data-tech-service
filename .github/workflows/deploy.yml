name: Deploy to Hostinger
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm install
          npm run build
        env:
          # If your build needs env variables (like DB URLs), add them here:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to Hostinger via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 65002
          # rm: true ensures the old .next folder is cleared before the new one is uploaded
          rm: true 
          source: ".next/,public/,package.json,next.config.mjs,server.js"
          target: "domains/datatechservice.in/nodejs/"

      - name: Restart Node.js App
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 65002
          script: |
            # Kill old processes and let Hostinger's passenger/manager restart it
            pkill -9 node || true
            cd domains/datatechservice.in/nodejs/
            # Ensure the env key is present so login doesn't break
            if ! grep -q "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" .env; then
              echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=6f753060662d46698656822459461156" >> .env
            fi