name: Deploy to Hostinger
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm install
          npm run build
        env:
          # GitHub uses these to connect to your DB during the build
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_BASE_URL: https://datatechservice.in

      - name: Deploy to Hostinger via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 65002
          rm: true 
          # This sends the BUILD results (.next) and the SOURCE folders
          source: ".next/,public/,package.json,next.config.mjs,server.js,app/,lib/,models/,store/,components/,components.json,postcss.config.mjs,jsconfig.json"
          target: "domains/datatechservice.in/nodejs/"

      - name: Restart & Cleanup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 65002
          script: |
            cd domains/datatechservice.in/nodejs/
            PATH=/opt/alt/alt-nodejs20/root/usr/bin:$PATH /opt/alt/alt-nodejs20/root/usr/bin/npm install --production
            pkill -9 node || true